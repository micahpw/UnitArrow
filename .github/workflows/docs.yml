name: Docs

# The site has two build inputs that are deliberately not in the repo:
#   docs/wasm/unitarrow_wasm.wasm  — compiled from crates/unitarrow-wasm
#   docs/generated/*.md            — emitted by the unitarrow-gen-docs binary
# Both are produced here, so the published site can never drift from the
# source it claims to demonstrate. Order matters: the wasm and the generated
# pages must exist before mkdocs reads the nav.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One in-flight build per ref; a superseded push has nothing worth finishing.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docs-

      # Raw ABI, no wasm-bindgen — unitarrow-wasm depends on unitarrow-core
      # only, so a plain cargo build plus a copy is the whole step.
      - name: Build the playground wasm
        run: |
          cargo build -p unitarrow-wasm --target wasm32-unknown-unknown --release
          mkdir -p docs/wasm
          cp target/wasm32-unknown-unknown/release/unitarrow_wasm.wasm docs/wasm/

      - name: Generate the live-example pages
        run: cargo run -p unitarrow-core --bin unitarrow-gen-docs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install mkdocs
        run: pip install -r docs/requirements.txt

      # --strict fails the build on mkdocs warnings (missing nav targets,
      # unreadable files). Verified to pass at the time this landed.
      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
