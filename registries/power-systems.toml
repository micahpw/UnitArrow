# UnitArrow registry — electric power systems (domain extension)
#
# This is NOT a standalone registry. It adds what the core registry lacks and
# composes with it (§7.5); it does not restate what is already there. Core
# already resolves `kV`, `kA`, `MW`, `Hz`, `ohm`, `S`, `F`, `H`, `rad`, `degC`,
# `Btu`, `mi`, `t` and the rest, including every SI-prefixed form.
#
#     compose("core@2026-08-07", "power-systems@0.2.0")
#
# It shrank from 37 units to 12 when core arrived, and comparing the two caught
# a real error: the hand-written `therm` here was 1.05505585262e8 J — the EC
# therm, 100,000 BTU(IT) — labelled as the US therm. UDUNITS has the US therm
# at 1.054804e8 J, 100,000 BTU(59°F). The entry is gone; core's is correct.
#
# What remains is genuinely domain-specific: reactive and apparent power, the
# spellings industry data actually uses, per-unit, currency, and watt-hours,
# which core does not carry as a symbol.

[registry]
schema_version = 1
name = "power-systems"
version = "0.2.0"

[registry.ambiguous.MBtu]
reason = "under SI prefixes M is mega, so MBtu reads as 10^6 Btu; the US gas industry reads M as the Roman thousand and means 10^3 Btu. Nothing in the string says which, and the two differ by 1000x."
use = ["MMBtu", "Btu"]
see = "https://unitarrow.org/generated/ambiguity/"

# ---------------------------------------------------------------------------
# Dimensions
#
# Named identically to core's, so composition sees the same vectors. A name is
# only ever a label on a vector (§6.2); commensurability is decided on the
# vector, so a domain registry naming one differently changes nothing.
# ---------------------------------------------------------------------------

[dimension.dimensionless]
vector = { }

[dimension.power]
vector = { mass = 1, length = 2, time = -3 }

[dimension.energy]
vector = { mass = 1, length = 2, time = -2 }

[dimension.angle]
vector = { angle = 1 }

[dimension.currency]
vector = { currency = 1 }

# ---------------------------------------------------------------------------
# Reactive and apparent power
#
# Dimensionally identical to core's watt, deliberately. No quantity kinds are
# declared, so `MW + MVAr` type-checks; separating them is a §7.3 decision this
# registry leaves open.
#
# `var` is the IEC 60027 symbol, so prefixing gives `kvar`, `Mvar`. Industry
# data commonly writes `MVAr` or `MVAR`, which cannot be aliases — an alias
# resolves to its unit's canonical symbol, so an alias on `var` would map MVAr
# to var and lose the mega. They are authored, legal because case differs from
# the derived `Mvar`.
# ---------------------------------------------------------------------------

[unit.var]
dimension = "power"
factor = [1, 1]
prefixes = "si-engineering"
display = { unicode = "var", long = "voltampere_reactive" }
provenance = { system = "iec", source = "IEC 60027" }

[unit.MVAr]
dimension = "power"
factor = [1000000, 1]
display = { unicode = "MVAr", long = "megavoltampere_reactive" }
provenance = { system = "industry", note = "spelling variant of Mvar" }

[unit.MVAR]
dimension = "power"
factor = [1000000, 1]
display = { unicode = "MVAR" }
provenance = { system = "industry", note = "spelling variant of Mvar" }

[unit.kVAr]
dimension = "power"
factor = [1000, 1]
display = { unicode = "kVAr", long = "kilovoltampere_reactive" }
provenance = { system = "industry", note = "spelling variant of kvar" }

# ---------------------------------------------------------------------------
# Energy
#
# Core has `J` and `W` and `h`, but no `Wh` symbol — and `MWh` is how the
# industry writes energy. Note §1 goal 4: `MWh` and `MW*h` are numerically
# identical and are DIFFERENT canonical forms, so pick one per pipeline.
# ---------------------------------------------------------------------------

[unit.Wh]
dimension = "energy"
factor = [3600, 1]
prefixes = "si-engineering"
display = { unicode = "Wh", long = "watthour", plural = "watthours" }
provenance = { system = "industry", note = "W*h as a single symbol; core carries J and W separately" }

[unit.varh]
dimension = "energy"
factor = [3600, 1]
prefixes = "si-engineering"
display = { unicode = "varh", long = "voltampere_reactive_hour" }
provenance = { system = "iec" }

[unit.MVArh]
dimension = "energy"
factor = [3600000000, 1]
display = { unicode = "MVArh", long = "megavoltampere_reactive_hour" }
provenance = { system = "industry", note = "spelling variant of Mvarh" }

[unit.MMBtu]
dimension = "energy"
factor = [52752792631, 50]
display = { unicode = "MMBtu", long = "million_british_thermal_units" }
provenance = { system = "us-customary", note = "10^6 Btu(IT). MM is the Roman million, not SI mega-mega — see [registry.ambiguous.MBtu]" }

# ---------------------------------------------------------------------------
# Angle, currency, per-unit
# ---------------------------------------------------------------------------

# Core spells it `arc_degree`, with `degree` as an alias. `deg` is the spelling
# power-systems data uses for phase angle.
[unit.deg]
dimension = "angle"
factor = [1, 180]
pi = 1
display = { unicode = "°", ascii = "deg", long = "phase_degree" }
provenance = { system = "industry", note = "core has this as arc_degree; `deg` is the conventional spelling here" }

[unit.delta_degC]
dimension = "temperature"
factor = [1, 1]
display = { unicode = "Δ°C", ascii = "delta_degC", long = "kelvin_difference" }
provenance = { system = "si", note = "the difference counterpart of degC (§6.4)" }

# EXACTLY ONE CURRENCY, DELIBERATELY. A second at factor 1 makes USD -> EUR
# convert at y = x — a fabricated exchange rate, offered silently. §2 is
# explicit that rates are time-varying data, not registry constants.
[unit.USD]
dimension = "currency"
factor = [1, 1]
display = { unicode = "USD", long = "US_dollar", plural = "US_dollars" }
provenance = { system = "iso-4217" }

# Per-unit. §5.4: valid only with a column-uniform `base`. Columns whose base
# varies per row — voltage p.u. across voltage levels, the normal case in a
# multi-zone model — are OUT OF SCOPE and must be shipped as physical units.
[unit.pu]
dimension = "dimensionless"
factor = [1, 1]
display = { unicode = "pu", long = "per_unit" }
provenance = { system = "industry" }
