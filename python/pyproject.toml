[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "unitarrow"
description = "Physical units and quantity semantics for Apache Arrow columns"
readme = "../README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

# pyarrow is NOT a required dependency. The extension module needs only the
# interpreter; `tag()` imports pyarrow lazily, so a caller who only wants to
# canonicalize unit strings — a validator, a linter, a CLI — pays nothing.
[project.optional-dependencies]
arrow = ["pyarrow>=14"]

[tool.maturin]
manifest-path = "../crates/unitarrow-py/Cargo.toml"
module-name = "unitarrow._unitarrow"
python-source = "src"
features = ["pyo3/extension-module"]
