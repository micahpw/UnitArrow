site_name: UnitArrow
site_description: Column-level unit metadata for Apache Arrow that survives the wire
docs_dir: docs
site_dir: .site
use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys

nav:
  - Home: index.md
  - Live examples:
      - generated/index.md
      - Playground: generated/playground.md
      - Canonical form: generated/canonical-form.md
      - Conversions: generated/conversions.md
      - Error codes: generated/errors.md
      - Ambiguous spellings: generated/ambiguity.md
      - Composing registries: generated/composition.md
      - Registry: generated/registry.md
      - Conformance: generated/conformance.md
      - Findings for review: generated/findings.md
      - Ambiguity register: generated/register.md
  - Specifications:
      - UnitArrow: unitarrow-spec.md
      - Provenance Companion: provenance-companion-spec.md
      - Roadmap: roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/unitarrow/unitarrow
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - js/playground.js
